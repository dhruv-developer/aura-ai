[project]
name = "aura-shadow"
version = "0.1.0"
description = "AURA shadow runs: replay sampled production traffic against candidate policies"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aura-shared", "aura-db", "aura-providers", "aura-xray", "aura-evaluation", "aura-billing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_shadow"]
