[project]
name = "aura-prompts"
version = "0.1.0"
description = "AURA prompt registry and optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aura-shared", "aura-db", "aura-cache", "aura-providers", "aura-evaluation", "aura-billing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_prompts"]
