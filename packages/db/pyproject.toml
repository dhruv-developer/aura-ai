[project]
name = "aura-db"
version = "0.1.0"
description = "AURA persistence: SQLAlchemy models, Alembic migrations, tenant-scoped sessions (RLS)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aura-shared",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_db"]
