[project]
name = "aura-evaluation"
version = "0.1.0"
description = "AURA evaluation: metrics, pairwise LLM judging, confidence intervals, deploy gates"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_evaluation"]
