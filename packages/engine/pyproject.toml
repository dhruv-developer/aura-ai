[project]
name = "aura-engine"
version = "0.1.0"
description = "AURA execution engine: quotas, routing, provider fallback, circuit breaking, telemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aura-shared",
  "aura-providers",
  "aura-policy",
  "aura-routing",
  "aura-billing",
  "aura-memory",
  "aura-learning",
  "aura-context",
  "aura-credentials",
  "aura-cache",
  "aura-db",
  "httpx>=0.28",
  "nats-py>=2.9",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_engine"]
