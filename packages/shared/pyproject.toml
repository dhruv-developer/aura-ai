[project]
name = "aura-shared"
version = "0.1.0"
description = "AURA foundation: settings, errors, ids, tenancy, Redis layer, event contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "cryptography>=43",
  "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_shared"]
