[project]
name = "aura-context"
version = "0.1.0"
description = "AURA context compiler: relevance, dedupe, extractive compression, ordering, budgets"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "aura-providers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_context"]
