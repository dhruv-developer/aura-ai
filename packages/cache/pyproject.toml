[project]
name = "aura-cache"
version = "0.1.0"
description = "AURA multi-tier cache: L1 in-process, L2 Redis, single-flight, early refresh"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_cache"]
