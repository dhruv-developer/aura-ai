[project]
name = "aura-policy"
version = "0.1.0"
description = "AURA ExecutionPolicy: constraints and preferences, merged stricter-wins across scopes"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_policy"]
