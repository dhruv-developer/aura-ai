[project]
name = "aura-routing"
version = "0.1.0"
description = "AURA model routing: task features, constraint filtering, tier selection, fallback chains"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "aura-providers", "aura-policy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_routing"]
