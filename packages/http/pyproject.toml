[project]
name = "aura-http"
version = "0.1.0"
description = "Shared HTTP plumbing for AURA FastAPI apps: RFC 7807 errors, body-size limits"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_http"]
