[project]
name = "aura-credentials"
version = "0.1.0"
description = "AURA BYOK: envelope-encrypted tenant provider credentials and their resolver"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "aura-db", "aura-cache", "aura-providers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_credentials"]
