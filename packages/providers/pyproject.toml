[project]
name = "aura-providers"
version = "0.1.0"
description = "AURA provider layer: normalized chat types, model catalog + pricing, provider adapters"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "anthropic>=1.10,<2", "httpx>=0.28", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_providers"]
