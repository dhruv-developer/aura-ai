# Plans, features and entitlements (spec §7–21, §37, §93).
# PRICES ARE HYPOTHESES to be validated with conversion and retention data (spec §8–9, §19–20).
# Prices are in minor units (paise). price_minor: null means a custom contract.
# Editing a plan's price or entitlements creates a new plan version on the next sync, and
# existing subscribers keep their version.

features:
  # --- boolean capabilities ---
  basic_routing:              {kind: boolean, description: Cheap vs strong model routing}
  advanced_routing:           {kind: boolean, description: Learned / reasoning-aware routing}
  prompt_optimization:        {kind: boolean, description: Prompt optimizer}
  advanced_context_optimizer: {kind: boolean, description: Context compiler with compression and budgets}
  semantic_reuse:             {kind: boolean, description: Semantic response cache}
  personal_memory:            {kind: boolean, description: Long-term personal memory}
  knowledge_retrieval:        {kind: boolean, description: Long-term memory and knowledge-base retrieval (RAG)}
  saved_workflows:            {kind: boolean, description: Saved workflows / execution recipes}
  research_mode:              {kind: boolean, description: Multi-step research graphs}
  long_running_workflows:     {kind: boolean, description: Async long-running executions}
  byok:                       {kind: boolean, description: Bring your own provider keys}
  api_access:                 {kind: boolean, description: Public API access}
  priority_execution:         {kind: boolean, description: Priority queue}
  workload_analytics:         {kind: boolean, description: Workload analytics and X-Ray}
  policies:                   {kind: boolean, description: Author and activate execution policies}
  shadow_optimization:        {kind: boolean, description: Shadow replay and comparison}
  policy_deployment:          {kind: boolean, description: Deploy optimized policies}
  canary_rollout:             {kind: boolean, description: Canary deployments with rollback}
  business_outcomes:          {kind: boolean, description: Outcome tracking and cost per outcome}
  advanced_rbac:              {kind: boolean, description: Custom roles}
  sso:                        {kind: boolean, description: SAML/OIDC single sign-on}
  scim:                       {kind: boolean, description: SCIM provisioning}
  advanced_audit:             {kind: boolean, description: Audit export and SIEM streaming}
  vpc_deployment:             {kind: boolean, description: VPC / dedicated runtime}
  customer_managed_keys:      {kind: boolean, description: Customer-managed encryption keys}
  # --- metered, reset every period ---
  executions:          {kind: metered, unit: execution, description: Execution runs}
  premium_model_calls: {kind: metered, unit: call, description: Frontier-model calls}
  research_jobs:       {kind: metered, unit: job, description: Research-mode jobs}
  api_requests:        {kind: metered, unit: request, description: API requests}
  shadow_runs:         {kind: metered, unit: run, description: Shadow replays}
  evaluation_runs:     {kind: metered, unit: run, description: Evaluation runs}
  monthly_credits:     {kind: metered, unit: credit, description: Credits granted each period}
  # --- gauges (a standing count, not reset) ---
  seats:     {kind: gauge, unit: seat, description: Team members}
  workloads: {kind: gauge, unit: workload, description: Tracked workloads}
  projects:  {kind: gauge, unit: project, description: Projects}

plans:
  free:
    name: Free
    audience: b2c
    priority_class: free
    price_minor: 0
    sort_order: 10
    entitlements:
      basic_routing: true
      prompt_optimization: true
      executions: {limit: 300, period: month}
      premium_model_calls: {limit: 20, period: month}
