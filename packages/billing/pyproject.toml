[project]
name = "aura-billing"
version = "0.1.0"
description = "AURA commercial core: plans, entitlements, subscriptions, credits ledger, usage, payments"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "aura-db", "aura-cache", "httpx>=0.28", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_billing"]
