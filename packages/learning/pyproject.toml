[project]
name = "aura-learning"
version = "0.1.0"
description = "AURA learned execution policies: contextual bandits, off-policy evaluation, priors"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_learning"]
