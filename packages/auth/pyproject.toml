[project]
name = "aura-auth"
version = "0.1.0"
description = "AURA identity: users, accounts, orgs, RBAC, sessions, magic links, OAuth, API keys"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aura-shared",
    "aura-db",
    "aura-cache",
    "httpx>=0.28",
    "signxml>=4.0",
    "defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_auth"]
