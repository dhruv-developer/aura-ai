[project]
name = "aura-deploy"
version = "0.1.0"
description = "AURA policy engine: versions, evidence-gated deployments, canary, rollback, outcomes"
requires-python = ">=3.12,<3.13"
dependencies = ["aura-shared", "aura-db", "aura-cache", "aura-policy", "aura-billing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_deploy"]
