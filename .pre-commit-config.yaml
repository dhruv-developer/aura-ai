repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-raw-redis-flush
        name: ban KEYS/FLUSHALL/FLUSHDB in application code
        language: pygrep
        entry: '\.(keys|flushall|flushdb)\('
        files: ^(packages|apps)/.*/src/
