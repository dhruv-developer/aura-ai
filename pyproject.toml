[project]
name = "aura"
version = "0.1.0"
description = "AURA — AI Execution Optimization platform (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/runtime", "apps/workers"]
exclude = ["packages/api-client"]  # TypeScript package (pnpm workspace)

[tool.uv.sources]
aura-shared = { workspace = true }
aura-cache = { workspace = true }
aura-db = { workspace = true }
aura-auth = { workspace = true }
aura-billing = { workspace = true }
aura-api = { workspace = true }
aura-providers = { workspace = true }
aura-policy = { workspace = true }
aura-routing = { workspace = true }
aura-engine = { workspace = true }
aura-http = { workspace = true }
aura-runtime = { workspace = true }
aura-workers = { workspace = true }
aura-credentials = { workspace = true }
aura-memory = { workspace = true }
aura-xray = { workspace = true }
aura-evaluation = { workspace = true }
aura-shadow = { workspace = true }
aura-deploy = { workspace = true }
aura-context = { workspace = true }
aura-prompts = { workspace = true }
aura-graph = { workspace = true }
aura-learning = { workspace = true }

[dependency-groups]
dev = [
  "aura-shared",
  "aura-cache",
  "aura-db",
  "aura-auth",
  "aura-billing",
  "aura-api",
  "aura-providers",
  "aura-policy",
  "aura-routing",
  "aura-engine",
  "aura-http",
  "aura-runtime",
  "aura-workers",
  "aura-credentials",
  "aura-memory",
  "aura-xray",
  "aura-evaluation",
  "aura-shadow",
  "aura-deploy",
  "aura-context",
  "aura-prompts",
  "aura-graph",
  "aura-learning",
  "httpx>=0.28",
  "types-PyYAML>=6.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "BLE", "TID"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["aura_shared", "aura_cache", "aura_db", "aura_auth", "aura_billing", "aura_api", "aura_providers", "aura_policy", "aura_routing", "aura_engine", "aura_http", "aura_runtime", "aura_workers", "aura_credentials", "aura_memory", "aura_xray", "aura_evaluation", "aura_shadow", "aura_deploy", "aura_context", "aura_prompts", "aura_graph", "aura_learning"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "ASYNC110"]  # tests may poll for async side effects
"**/migrations/versions/**" = ["E501"]  # autogenerated DDL
"tools/**" = ["E501"]  # data generators

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aura_shared", "aura_cache", "aura_db", "aura_auth", "aura_billing", "aura_api", "aura_providers", "aura_policy", "aura_routing", "aura_engine", "aura_http", "aura_runtime", "aura_workers", "aura_credentials", "aura_memory", "aura_xray", "aura_evaluation", "aura_shadow", "aura_deploy", "aura_context", "aura_prompts", "aura_graph", "aura_learning"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_packages = ["aura_shared", "aura_cache", "aura_db", "aura_auth", "aura_billing", "aura_api", "aura_providers", "aura_policy", "aura_routing", "aura_engine", "aura_http", "aura_runtime", "aura_workers", "aura_credentials", "aura_memory", "aura_xray", "aura_evaluation", "aura_shadow", "aura_deploy", "aura_context", "aura_prompts", "aura_graph", "aura_learning"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Package layering (apps -> engine -> services -> infrastructure -> shared)"
type = "layers"
layers = [
  "aura_api | aura_runtime | aura_workers",
  "aura_shadow",
  "aura_engine | aura_xray | aura_deploy | aura_prompts | aura_graph",
  "aura_auth | aura_billing | aura_routing | aura_credentials | aura_memory | aura_context",
  "aura_db | aura_cache | aura_providers | aura_policy | aura_http | aura_evaluation | aura_learning",
  "aura_shared",
]

[[tool.importlinter.contracts]]
name = "Domain layers are pure: no I/O, frameworks or persistence"
type = "forbidden"
source_modules = ["aura_auth.domain", "aura_billing.domain", "aura_providers.domain", "aura_policy", "aura_routing", "aura_xray.domain", "aura_evaluation", "aura_context", "aura_prompts.templates", "aura_graph.ir", "aura_graph.intent", "aura_graph.planner", "aura_learning"]
forbidden_modules = ["sqlalchemy", "redis", "httpx", "fastapi", "aura_db", "aura_cache"]

[[tool.importlinter.contracts]]
name = "Domain layers do not depend on their application layers"
type = "forbidden"
source_modules = ["aura_auth.domain", "aura_billing.domain"]
forbidden_modules = ["aura_auth.application", "aura_auth.adapters", "aura_billing.application", "aura_billing.adapters"]
